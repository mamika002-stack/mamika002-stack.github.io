function perCard(from,to){
  const by = {}; let tot=0;
  for(const x of S.tx){ if(x.t==='out' && x.d>=from && x.d<=to && (x.c==='c_per'||x.sensitive)){ const k = x.staffId || '_'; by[k]=(by[k]||0)+x.a; tot+=x.a; } }
  if(!tot) return '';
  const ciro = sumRange(from,to).i, keys = Object.keys(by).sort((a,b)=>by[b]-by[a]);
  const nm = k=>{ if(k==='_') return 'Diğer personel kayıtları'; const s=(S.staff||[]).find(z=>z.id===k); return s?s.name:'Silinmiş personel'; };
  return '<div class="card section"><div class="card-h"><h3>Personel gideri</h3><b class="num" style="color:var(--out)">'+money(tot)+'</b></div>'+
    '<p class="muted" style="margin:0 0 8px;font-size:calc(13.5px*var(--fs,1))">Cironun '+(ciro?'<b>%'+NF1.format(tot/ciro*100)+'</b>':'—')+'’i</p>'+
    tableHtml(['Kişi','Tutar','Pay'], keys.map(k=>({cells:[{v:nm(k)},{v:money(by[k])},{v:'%'+NF1.format(by[k]/tot*100)}]})).concat([{total:true,cells:[{v:'Toplam'},{v:money(tot)},{v:'%100'}]}]))+'</div>';
}
function komCard(from,to){
  const br = feeBreakdown(from,to), keys = Object.keys(br).sort((a,b)=>br[b]-br[a]); const tot = keys.reduce((a,k)=>a+br[k],0);
  if(!tot) return '';
  return '<div class="card section"><div class="card-h"><h3>Toplam ödenen komisyon</h3><b class="num" style="color:var(--warn)">'+money(tot)+'</b></div>'+
    tableHtml(['Kanal','Komisyon','Pay'], keys.map(k=>({cells:[{v:comKeyName(k)},{v:money(br[k])},{v:'%'+NF1.format(br[k]/tot*100)}]})).concat([{total:true,cells:[{v:'Toplam'},{v:money(tot)},{v:'%100'}]}]))+'</div>';
}
function catRows(t, from, to){
  const sums={}, cnt={}; let total=0;
  for(const x of S.tx){ if(x.t===t && x.d>=from && x.d<=to){ sums[x.c]=(sums[x.c]||0)+x.a; cnt[x.c]=(cnt[x.c]||0)+1; total+=x.a; } }
  if(t==='out'){ const f=feeRange(from,to); if(f>0){ sums.c_kom=f; cnt.c_kom=0; total+=f; } }
  return {total, list:Object.keys(sums).sort((a,b)=>sums[b]-sums[a]).map(k=>({c:catById(k), v:sums[k], n:cnt[k]}))};
}
function reportData(){
  const R = UI.rep;
  if(R.tab==='month'){
    const y = R.year, m = Array.from({length:12},()=>({i:0,o:0}));
    for(const x of S.tx){ if(+x.d.slice(0,4)===y){ const k=+x.d.slice(5,7)-1; if(x.t==='in') m[k].i+=x.a; else m[k].o+=x.a; } }
    m.forEach(x=>{ x.f=0; x.p=0; }); for(const x of S.tx){ if(x.t==='out' && +x.d.slice(0,4)===y && (x.c==='c_per'||x.sensitive)) m[+x.d.slice(5,7)-1].p+=x.a; } const tp=m.reduce((a,b)=>a+b.p,0);
    const fm=feeByDay(y+'-01-01', y+'-12-31'); for(const d in fm) m[+d.slice(5,7)-1].f+=fm[d];
    const ti=m.reduce((a,b)=>a+b.i,0), to=m.reduce((a,b)=>a+b.o,0), tf=m.reduce((a,b)=>a+b.f,0);
    const head=['Kalem'].concat(MONTHS_S,['Toplam']);
    const mk=(lbl,fn,cls)=>({cells:[{v:lbl}].concat(m.map(x=>{const v=fn(x); return v==null?{v:'—'}:{v:v.txt, cls:cls?cls(v.raw):''};}),[(()=>{const v=fn({i:ti,o:to,f:tf,p:tp}); return v==null?{v:'—'}:{v:v.txt,cls:cls?cls(v.raw):''};})()])});
    const rows=[mk('Gelir',x=>({txt:x.i?NF0.format(x.i/100):'0',raw:x.i})), mk('Gider',x=>({txt:x.o?NF0.format(x.o/100):'0',raw:x.o})),
      mk('  içinde personel',x=>({txt:x.p?NF0.format(x.p/100):'0',raw:x.p})),
      mk('Ödenen komisyon',x=>({txt:x.f?'−'+NF0.format(x.f/100):'0',raw:-x.f}),v=>v<0?'neg':''),
      Object.assign(mk('Net kâr',x=>({txt:NF0.format((x.i-x.o-x.f)/100),raw:x.i-x.o-x.f}),v=>v>0?'pos':v<0?'neg':''),{total:true}),
      mk('Marj',x=>x.i?{txt:'%'+NF0.format((x.i-x.o-x.f)/x.i*100),raw:x.i-x.o-x.f}:null),
      mk('Personel / ciro',x=>x.i?{txt:'%'+NF1.format(x.p/x.i*100),raw:0}:null)];
    const csv=[head].concat([['Gelir',m.map(x=>csvNum(x.i)),csvNum(ti)],['Gider',m.map(x=>csvNum(x.o)),csvNum(to)],['Personel gideri',m.map(x=>csvNum(x.p)),csvNum(tp)],['Ödenen komisyon',m.map(x=>csvNum(x.f)),csvNum(tf)],['Net',m.map(x=>csvNum(x.i-x.o-x.f)),csvNum(ti-to-tf)]].map(r=>[r[0]].concat(r[1],[r[2]])));
    const html='<div class="card"><div class="card-h"><div class="row"><button class="icon-btn no-print" data-ryear="-1" aria-label="Önceki yıl">'+ic('chevL',20)+'</button><h3 style="font-size:calc(20px*var(--fs,1))">'+y+'</h3><button class="icon-btn no-print" data-ryear="1" aria-label="Sonraki yıl">'+ic('chevR',20)+'</button></div>'+
      '<div class="legend"><span><i style="background:var(--in-line)"></i>Gelir</span><span><i style="background:var(--out-line)"></i>Gider</span></div></div><div class="chart-wrap" id="repChart"></div></div>'+
      '<div class="card section"><div class="card-h"><h3>12 aylık özet</h3><span class="muted">Tutarlar ₺, kuruşsuz</span></div>'+tableHtml(head,rows)+'</div>'+
      '<div class="kpis section"><div class="kpi"><div class="kpi-label">Yıllık gelir</div><div class="kpi-val num" style="color:var(--in)">'+money(ti,{round:true})+'</div></div><div class="kpi"><div class="kpi-label">Yıllık gider</div><div class="kpi-val num" style="color:var(--out)">'+money(to,{round:true})+'</div></div><div class="kpi"><div class="kpi-label">Ödenen komisyon</div><div class="kpi-val num" style="color:var(--warn)">'+money(tf,{round:true})+'</div></div><div class="kpi"><div class="kpi-label">Yıllık net</div><div class="kpi-val num">'+money(ti-to-tf,{round:true})+'</div></div><div class="kpi"><div class="kpi-label">Ortalama aylık net</div><div class="kpi-val num">'+money(Math.round((ti-to-tf)/Math.max(1,m.filter(x=>x.i||x.o).length)),{round:true})+'</div></div></div>';
    return {title:'Aylık özet '+y, range:'01.01.'+y+' – 31.12.'+y, html, csv};
  }
  if(R.tab==='cat'){
    const r = getRange(R.p,R.cf,R.ct);
    const custom = R.p==='custom' ? '<div class="two no-print" style="margin-top:10px"><div class="field"><label for="rc1">Başlangıç</label><input class="input" type="date" id="rc1" value="'+r.from+'"></div><div class="field"><label for="rc2">Bitiş</label><input class="input" type="date" id="rc2" value="'+r.to+'"></div></div>' : '';
    const block = (t,title)=>{ const d=catRows(t,r.from,r.to); if(!d.total) return '<div class="card section"><div class="card-h"><h3>'+title+'</h3></div><p class="muted" style="margin:0">Bu dönemde kayıt yok.</p></div>';
      return '<div class="card section"><div class="card-h"><h3>'+title+'</h3><b class="num" style="color:var(--'+t+')">'+money(d.total)+'</b></div>'+
        tableHtml(['Kategori','İşlem','Tutar','Pay'], d.list.map(e=>({cells:[{html:'<span class="row" style="gap:8px"><i style="width:10px;height:10px;border-radius:3px;background:'+e.c.color+';display:inline-block"></i>'+esc(e.c.name)+'</span>'},{v:e.n?NF0.format(e.n):'—'},{v:money(e.v)},{html:'<span class="row" style="gap:8px;justify-content:flex-end"><span class="progress no-print" style="width:60px;display:inline-block"><i style="width:'+(e.v/d.total*100)+'%;background:'+e.c.color+'"></i></span>%'+NF1.format(e.v/d.total*100)+'</span>'}]})).concat([{total:true,cells:[{v:'Toplam'},{v:NF0.format(d.list.reduce((a,e)=>a+e.n,0))},{v:money(d.total)},{v:'%100'}]}]))+'</div>'; };
    const csv=[['Tür','Kategori','İşlem sayısı','Tutar','Pay %']];
    ['out','in'].forEach(t=>{ const d=catRows(t,r.from,r.to); d.list.forEach(e=>csv.push([t==='in'?'Gelir':'Gider',e.c.name,e.n,csvNum(e.v),(e.v/d.total*100).toFixed(1).replace('.',',')])); });
    return {title:'Kategori raporu', range:trDate(r.from)+' – '+trDate(r.to), csv,
      html:'<div class="no-print">'+periodChips(R.p,'','data-rperiod')+custom+'</div><p class="muted no-print" style="margin:10px 2px 0;font-size:calc(13.5px*var(--fs,1))">'+esc(trDate(r.from)+' – '+trDate(r.to))+'</p>'+block('out','Gider kategorileri')+perCard(r.from,r.to)+komCard(r.from,r.to)+block('in','Gelir kategorileri')};
  }
  if(R.tab==='cmp'){
    const t=today(); let a, b, la, lb;
    if(R.cmp==='week'){ a=getRange('week'); b={from:a.pf,to:a.pt}; la='Bu hafta'; lb='Geçen hafta'; }
    else if(R.cmp==='year'){ a=getRange('year'); b={from:a.pf,to:a.pt}; la='Bu yıl'; lb='Geçen yıl (aynı dönem)'; }
    else if(R.cmp==='custom'){ a={from:R.a1||monthStart(t), to:R.a2||t}; b={from:R.b1||addMonths(monthStart(t),-1), to:R.b2||monthEnd(addMonths(monthStart(t),-1))}; la='Dönem A'; lb='Dönem B'; }
    else { a=getRange('month'); b={from:a.pf,to:a.pt}; la='Bu ay'; lb='Geçen ay (aynı günler)'; }
    if(a.from>a.to){ const x=a.from; a.from=a.to; a.to=x; } if(b.from>b.to){ const x=b.from; b.from=b.to; b.to=x; }
    const A=sumRange(a.from,a.to), B=sumRange(b.from,b.to);
    const ca={}, cb={}; for(const x of S.tx){ if(x.d>=a.from&&x.d<=a.to) ca[x.c]=(ca[x.c]||0)+x.a; if(x.d>=b.from&&x.d<=b.to) cb[x.c]=(cb[x.c]||0)+x.a; }
    const pct=(x,y)=>y?((x-y)/Math.abs(y)*100):null;
    const line=(lbl,x,y,goodUp,bold)=>{ const p=pct(x,y), d=x-y; const good = d===0?'':((d>0)===goodUp?'pos':'neg');
      return {total:bold, cells:[{html:lbl},{v:money(x)},{v:money(y)},{v:money(d,{sign:true}),cls:good},{v:p==null?'—':(p>0?'+':p<0?'−':'')+'%'+NF1.format(Math.abs(p)),cls:good}]}; };
    const perOf=(f,t)=>S.tx.reduce((a,x)=>a+(x.t==='out'&&x.d>=f&&x.d<=t&&(x.c==='c_per'||x.sensitive)?x.a:0),0);
    const rows=[line('<b>Gelir</b>',A.i,B.i,true),line('<b>Gider</b>',A.exp,B.exp,false),line('<span style="padding-left:12px">içinde personel</span>',perOf(a.from,a.to),perOf(b.from,b.to),false),line('<b>Ödenen komisyon</b>',A.fee,B.fee,false)];
    S.cats.slice().sort((x,y)=>(x.t===y.t?x.order-y.order:x.t==='in'?-1:1)).forEach(c=>{ if(ca[c.id]||cb[c.id]) rows.push(line('<span style="padding-left:12px;color:var(--text-2)">'+esc(c.name)+'</span>',ca[c.id]||0,cb[c.id]||0,c.t==='in')); });
    rows.push(line('<b>Net kâr</b>',A.net,B.net,true,true));
    const csv=[['Kalem',la+' ('+trDate(a.from)+'-'+trDate(a.to)+')',lb+' ('+trDate(b.from)+'-'+trDate(b.to)+')','Fark']].concat([['Gelir',A.i,B.i],['Gider',A.exp,B.exp],['Ödenen komisyon',A.fee,B.fee]].concat(S.cats.filter(c=>ca[c.id]||cb[c.id]).map(c=>[c.name,ca[c.id]||0,cb[c.id]||0]),[['Net',A.net,B.net]]).map(r=>[r[0],csvNum(r[1]),csvNum(r[2]),csvNum(r[1]-r[2])]));
    const custom = R.cmp==='custom' ? '<div class="card section no-print"><div class="label" style="margin-bottom:8px">Dönem A</div><div class="two"><input class="input" type="date" id="ra1" value="'+a.from+'" aria-label="Dönem A başlangıç"><input class="input" type="date" id="ra2" value="'+a.to+'" aria-label="Dönem A bitiş"></div><div class="label" style="margin:12px 0 8px">Dönem B</div><div class="two"><input class="input" type="date" id="rb1" value="'+b.from+'" aria-label="Dönem B başlangıç"><input class="input" type="date" id="rb2" value="'+b.to+'" aria-label="Dönem B bitiş"></div></div>' : '';
    return {title:'Dönem karşılaştırma', range:la+': '+trDate(a.from)+'–'+trDate(a.to)+' / '+lb+': '+trDate(b.from)+'–'+trDate(b.to), csv,
      html:'<div class="chips no-print">'+[['month','Bu ay / Geçen ay'],['week','Bu hafta / Geçen hafta'],['year','Bu yıl / Geçen yıl'],['custom','Özel']].map(o=>'<button class="chip'+(R.cmp===o[0]?' on':'')+'" data-rcmp="'+o[0]+'">'+o[1]+'</button>').join('')+'</div>'+custom+
        '<div class="card section">'+tableHtml(['Kalem',la,lb,'Fark','Değişim'],rows)+'<p class="muted" style="font-size:calc(12.5px*var(--fs,1));margin:12px 0 0">'+esc(la)+': '+trDate(a.from)+' – '+trDate(a.to)+' · '+esc(lb)+': '+trDate(b.from)+' – '+trDate(b.to)+'</p></div>'};
  }
  // haftanın günleri
  const t=today(); const span = R.wd==='all'?null:+R.wd;
  let from = span? addDays(t,-(span-1)) : (S.tx.reduce((m,x)=>x.d<m?x.d:m, t));
  const daily={}; for(const x of S.tx){ if(x.t==='in' && x.d>=from && x.d<=t) daily[x.d]=(daily[x.d]||0)+x.a; }
  const agg=Array.from({length:7},()=>({sum:0,n:0}));
  Object.keys(daily).forEach(d=>{ const k=toDate(d).getDay(); agg[k].sum+=daily[d]; agg[k].n++; });
  const order=[1,2,3,4,5,6,0], avg=order.map(k=>({k, v:agg[k].n?Math.round(agg[k].sum/agg[k].n):0, n:agg[k].n}));
  const has=avg.filter(a=>a.n), mx=Math.max(1,...avg.map(a=>a.v));
  const best=has.length?has.reduce((a,b)=>b.v>a.v?b:a):null, worst=has.length>1?has.reduce((a,b)=>b.v<a.v?b:a):null;
  const csv=[['Gün','Ortalama satış','Gün sayısı']].concat(avg.map(a=>[DAYS[a.k],csvNum(a.v),a.n]));
  return {title:'Haftanın günlerine göre ortalama satış', range:trDate(from)+' – '+trDate(t), csv,
    html:'<div class="chips no-print">'+[['28','Son 4 hafta'],['90','Son 3 ay'],['365','Son 1 yıl'],['all','Tümü']].map(o=>'<button class="chip'+(R.wd===o[0]?' on':'')+'" data-rwd="'+o[0]+'">'+o[1]+'</button>').join('')+'</div>'+
    (best?'<div class="kpis section"><div class="kpi"><div class="kpi-label"><i class="dot" style="background:var(--in-line)"></i>En iyi gün</div><div class="kpi-val">'+DAYS[best.k]+'</div><div class="muted num">Ort. '+money(best.v)+'</div></div><div class="kpi"><div class="kpi-label"><i class="dot" style="background:var(--out-line)"></i>En zayıf gün</div><div class="kpi-val">'+(worst?DAYS[worst.k]:'—')+'</div><div class="muted num">'+(worst?'Ort. '+money(worst.v):'')+'</div></div></div>':'')+
    '<div class="card section"><div class="card-h"><h3>Günlük ortalama satış</h3><span class="muted">Satış olan günler</span></div><div class="wd-bars">'+avg.map(a=>'<div class="wd'+(best&&a.k===best.k?' best':'')+(worst&&a.k===worst.k?' worst':'')+'"><span style="font-weight:600">'+DAYS[a.k]+'</span><span class="bar"><i style="width:'+(a.v/mx*100)+'%"></i></span><span class="v">'+(a.n?money(a.v,{round:true}):'—')+'</span></div>').join('')+'</div>'+
    '<p class="muted" style="font-size:calc(12.5px*var(--fs,1));margin:14px 0 0">'+esc(trDate(from)+' – '+trDate(t))+' arasında, gelir girilen günlerin ortalamasıdır.</p></div>'};
}

/* Kategoriler */
function openCats(type){
  type = type||'out';
  const draw = ()=>'<div class="seg" style="margin-bottom:12px">'+[['out','Gider'],['in','Gelir']].map(t=>'<button class="'+(type===t[0]?'on':'')+'" data-ct="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>'+
    '<div class="list">'+catsOf(type).map((c,i,arr)=>'<div class="li">'+catBubble(c,40)+'<div class="grow"><div class="t">'+esc(c.name)+'</div><div class="s">'+(c.budget?'Bütçe '+money(c.budget,{round:true})+'/ay':(type==='out'?'Bütçe yok':''))+'</div></div>'+
      '<button class="icon-btn" data-rapid data-mv="'+c.id+'" data-dir="-1" aria-label="Yukarı taşı"'+(i===0?' disabled style="opacity:.25"':'')+'>'+ic('chevU',20)+'</button><button class="icon-btn" data-rapid data-mv="'+c.id+'" data-dir="1" aria-label="Aşağı taşı"'+(i===arr.length-1?' disabled style="opacity:.25"':'')+'>'+ic('chevD',20)+'</button>'+
      '<button class="icon-btn" data-ced="'+c.id+'" aria-label="Düzenle">'+ic('edit',19)+'</button></div>').join('')+'</div>';
  const sh = openSheet({title:'Kategoriler', body:draw(), foot:'<button class="btn btn-primary btn-lg" data-cnew="1">'+ic('plus',19,2.4)+' Yeni kategori</button>'});
  const re = ()=>{ sh.el.querySelector('.sheet-b').innerHTML = draw(); };
  sh.el.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.ct){ type=b.dataset.ct; re(); }
    else if(b.dataset.mv){ const arr=catsOf(type), i=arr.findIndex(c=>c.id===b.dataset.mv), j=i+(+b.dataset.dir); if(j<0||j>=arr.length) return; const o=arr[i].order; arr[i].order=arr[j].order; arr[j].order=o; setConfig({cats:S.cats},'Kategori sırası'); re(); }
    else if(b.dataset.ced){ sh.close(true); editCat(b.dataset.ced, type); }
    else if(b.dataset.cnew){ sh.close(true); editCat(null, type); }
  });
}
function editCat(id, type){
  const c = id ? S.cats.find(x=>x.id===id) : {t:type, name:'', icon:type==='in'?'coins':'box', color:COLORS[S.cats.length%COLORS.length], budget:0};
  const T = {name:c.name, icon:c.icon, color:c.color};
  const used = id ? S.tx.filter(x=>x.c===id).length : 0;
  const body = ()=>'<div class="row" style="justify-content:center;margin:4px 0 16px">'+catBubble({icon:T.icon,color:T.color},64)+'</div>'+
    '<div class="field"><label for="cName">Kategori adı</label><input class="input" id="cName" value="'+esc(T.name)+'" maxlength="30" placeholder="Örn: Tüp / Gaz"></div>'+

/* ---------------- PIN tuş takımı ---------------- */
function pinPad(host, onDone, len, opts){
  len = len||6; opts = opts||{}; let v='';
  const left = opts.left ? '<button type="button" class="pk-side" data-pkl="1" aria-label="'+esc(opts.left.aria||'Geri')+'">'+opts.left.label+'</button>' : '<span></span>';
  host.innerHTML = '<div class="pin-dots" aria-hidden="true">'+'<i></i>'.repeat(len)+'</div><div class="keypad pin-keys">'+['1','2','3','4','5','6','7','8','9','L','0','back'].map(k=>k==='L'?left:'<button type="button" data-pk="'+k+'" aria-label="'+(k==='back'?'Sil':k)+'">'+(k==='back'?ic('backspace',30):k)+'</button>').join('')+'</div>';
  const dots = host.querySelector('.pin-dots');
  let lockedPad = false;
  const upd = ()=>$$('i',dots).forEach((d,i)=>d.classList.toggle('f',i<v.length));
  const press = k=>{ if(lockedPad) return; if(k==='back') v=v.slice(0,-1); else if(v.length<len) v+=k; upd(); if(v.length===len){ const p=v; lockedPad=true; setTimeout(()=>onDone(p),120); } };
  bindKeys(host.querySelector('.pin-keys'), '[data-pk],[data-pkl]', b=>{ if(b.dataset.pkl){ if(opts.left) opts.left.onClick(); } else press(b.dataset.pk); });
  const kd = e=>{ if(!document.contains(host)){ document.removeEventListener('keydown',kd); return; } if(/^[0-9]$/.test(e.key)) press(e.key); else if(e.key==='Backspace') press('back'); };
  document.addEventListener('keydown',kd);
  return {reset(err){ v=''; lockedPad=false; upd(); if(err){ dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake'); } }, destroy(){ document.removeEventListener('keydown',kd); }};
}

/* ---------------- Gün sonu özetini paylaş (WhatsApp) ---------------- */
function daySummaryText(d){
  const cl = S.closings.find(c=>c.d===d), rec = kasaRecorded(d);
  let cash, lines, diff=null, by='';
  if(cl){ cash=cl.cash; lines=closingLines(cl).map(l=>({name:l.name, k:l.k, gross:l.gross||0, fee:l.fee||0})); diff=cl.diff; const p=personById(cl.byPid); by=(p&&p.name)||cl.byName||''; }
  else if($('#kForm')){ const v=kasaVals(); cash=v.cash; lines=v.lines.map(l=>({name:l.name, k:l.k, gross:l.gross, fee:l.fee})); if(v.countRaw && !isNaN(parseMoney(v.countRaw))) diff=v.counted-(v.open+v.cash-v.out); }
  else { cash=rec.cash; lines=kasaLines(rec).map(l=>({name:l.name, k:l.k, gross:l.rec, fee:0})); }
  const card = lines.filter(l=>l.k==='card').reduce((a,l)=>a+l.gross,0);
  const onl = lines.filter(l=>l.k!=='card' && l.gross>0);
  const online = onl.reduce((a,l)=>a+l.gross,0), fee = lines.reduce((a,l)=>a+l.fee,0), gross = cash+card+online;
  const dt = toDate(d), out = [];
  out.push('*'+(S.settings.biz||'Döner Kasa')+' — Gün Sonu*');
  out.push(trDate(d)+' '+DAYS[dt.getDay()]+(cl?'':' (gün henüz kapatılmadı)'));
  out.push('');
  out.push('Nakit: '+money(cash));
  out.push('Kart: '+money(card));
  out.push('Online: '+money(online));
  onl.forEach(l=>out.push('  · '+l.name+': '+money(l.gross)));
  out.push('Brüt satış: '+money(gross));
  if(fee) out.push('Komisyon: −'+money(fee));
  out.push('Net gelir: '+money(gross-fee));
  if(can('seeProfit')){
    out.push('Giderler: −'+money(rec.exp)+(isAdmin()?'':' (personel hariç)'));
    out.push('');
    out.push('*GÜNÜN NET KÂRI: '+money(gross-fee-rec.exp)+'*');
  }
  if(diff!=null){ out.push(''); out.push(diff===0 ? 'Kasa: tam' : diff<0 ? 'Kasa açığı: '+money(diff) : 'Kasa fazlası: +'+money(diff)); }
  if(by) out.push('Kapatan: '+by);
  return out.join('\n');
}

function exportRows(r){
  const closed = new Map(); S.closings.forEach(c=>{ if(c.d>=r.from && c.d<=r.to && Array.isArray(c.lines)) closed.set(c.d,c); });
  const txs = S.tx.filter(x=>x.d>=r.from && x.d<=r.to).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(a.ts||0)-(b.ts||0));
  const rows = [];
  txs.forEach(x=>{
    const fee = (x.t==='in' && !closed.has(x.d)) ? (x.fee||0) : 0;
    const by = personById(x.byPid);
    rows.push({d:x.d, ts:x.ts||0, t:x.t, cat:catById(x.c).name, desc:x.desc||'', m:METHODS[x.m]||'', plat:x.plat?platName(x.plat):'', gross:x.a, fee, net:x.t==='in'?x.a-fee:x.a, by:(by&&by.name)||x.byName||'', per:x.c==='c_per'||!!x.sensitive});
  });
  closed.forEach(c=>{ const by=personById(c.byPid);
    c.lines.forEach(l=>{ if(!(l.fee>0)) return; rows.push({d:c.d, ts:(c.ts||0)+1, t:'out', cat:KOM_CAT.name, desc:l.name+' komisyonu %'+rateStr(l.rate)+' (gün sonu)', m:'Kesinti', plat:'', gross:l.fee, fee:0, net:l.fee, by:(by&&by.name)||c.byName||'', kom:true}); }); });
  rows.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.ts-b.ts);
  const inc = rows.filter(x=>x.t==='in'), out = rows.filter(x=>x.t==='out');
  const tot = {gross:inc.reduce((s,x)=>s+x.gross,0), fee:inc.reduce((s,x)=>s+x.fee,0)+out.filter(x=>x.kom).reduce((s,x)=>s+x.gross,0),
    exp:out.filter(x=>!x.kom).reduce((s,x)=>s+x.gross,0), per:out.filter(x=>x.per).reduce((s,x)=>s+x.gross,0)};
  tot.net = tot.gross - tot.fee - tot.exp;
  return {rows, tot};
}
function accountantCSV(r){
  const {rows, tot} = exportRows(r);
  const out = [['Tarih','Tür','Kategori','Açıklama','Ödeme yöntemi','Brüt tutar','Komisyon','Net tutar','Kaydı giren']];
  rows.forEach(x=>out.push([trDate(x.d), x.t==='in'?'Gelir':'Gider', x.cat, x.desc+(x.plat?' ('+x.plat+')':''), x.m, csvNum(x.gross), x.fee?csvNum(x.fee):'', csvNum(x.net), x.by]));
  out.push([]);
  out.push(['ÖZET',r.label]);
  [['Brüt gelir',tot.gross],['Toplam komisyon',tot.fee],['Net gelir',tot.gross-tot.fee],['Giderler (komisyon hariç)',tot.exp],['  içinde personel gideri',tot.per],['Net kâr',tot.net]].forEach(z=>out.push([z[0],'','','','',csvNum(z[1])]));
  if(downloadFile('doner-kasa-muhasebe-'+r.file+'.csv', toCSV(out), 'text/csv;charset=utf-8')) toast(rows.length+' satır indirildi · Excel ile açabilirsin','success',{duration:4000});
}

/* =========================================================
   PERSONEL: liste, hakediş, ödemeler (sadece yönetici)
   Para verilen her hareket (avans, maaş ödemesi, peşin prim/mesai) tek bir "ptx" kaydıdır:
   hem personel ödemesi hem de "Personel" kategorisinde giderdir. Böylece çift kayıt olmaz,
   silme/düzenleme gideri de aynı anda değiştirir.
   Para verilmeyen hareketler (maaşa eklenecek prim/mesai, kesinti) "payroll" koleksiyonundadır;
   gider sayılmaz, sadece kalan ödenecek tutarı değiştirir.
   ========================================================= */
const ST_KIND = {
  adv:{t:'Avans', icon:'cash', paid:true},
  sal:{t:'Maaş ödemesi', icon:'wallet', paid:true},
  bonus:{t:'Prim', icon:'sparkles'},
  ot:{t:'Mesai', icon:'clock'},
  ded:{t:'Kesinti', icon:'minus'}
};
UI.st = UI.st || {p:'month', cf:null, ct:null};
const ST_PERIODS = [['month','Bu ay'],['lastmonth','Geçen ay'],['year','Bu yıl'],['custom','Özel']];
const NFH = new Intl.NumberFormat('tr-TR',{maximumFractionDigits:2});
function hoursStr(h){ return NFH.format(h)+' saat'; }
function parseHours(v){ v=String(v==null?'':v).trim().replace(/\s/g,'').replace(',','.'); if(!v) return NaN; if(!/^\d{0,3}(\.\d{0,2})?$/.test(v)) return NaN; const n=Number(v); return isFinite(n)?n:NaN; }
function isHourly(x){ return x && x.kind==='ot' && typeof x.hours==='number' && x.hours>0; }
function staffById(id){ return (S.staff||[]).find(s=>s.id===id) || null; }
function perCatId(){ return S.cats.some(c=>c.id==='c_per') ? 'c_per' : (catsOf('out')[0]||{id:'c_per'}).id; }
/* Dönem içindeki maaş hakkı: işe girişten itibaren dönemin kapsadığı her ay için bir aylık maaş */
function salaryDue(s, from, to){
  if(!s.salary) return 0;
  const end = to>today()?today():to;
  let start = from; if(s.start && s.start>start) start = s.start;
  if(start>end) return 0;
  let n=0, m=monthStart(start);
  while(m<=end){ n++; m=addMonths(m,1); }
  return n*s.salary;
}
function staffMoves(id, from, to){
  const pays = S.tx.filter(x=>x.staffId===id && x.d>=from && x.d<=to);
  const acc = (S.payroll||[]).filter(x=>x.staffId===id && !x.deleted && x.d>=from && x.d<=to);
  return {pays, acc};
}
function staffStats(s, from, to){
  const {pays, acc} = staffMoves(s.id, from, to);
  const r = {otHours:0, otLegacy:0, salaryDue:salaryDue(s,from,to), adv:0, sal:0, bonusPaid:0, otPaid:0, bonusAcc:0, otAcc:0, ded:0, given:0};
  pays.forEach(x=>{ r.given+=x.a; if(x.kind==='adv') r.adv+=x.a; else if(x.kind==='sal') r.sal+=x.a; else if(x.kind==='bonus') r.bonusPaid+=x.a; else if(x.kind==='ot') r.otPaid+=x.a; else r.adv+=x.a; });
  pays.concat(acc).forEach(x=>{ if(x.kind==='ot'){ if(isHourly(x)) r.otHours+=x.hours; else r.otLegacy+=x.a; } });
  acc.forEach(x=>{ if(x.kind==='bonus') r.bonusAcc+=x.a; else if(x.kind==='ot') r.otAcc+=x.a; else if(x.kind==='ded') r.ded+=x.a; });
  r.bonus = r.bonusPaid+r.bonusAcc; r.ot = r.otPaid+r.otAcc;
  r.earned = r.salaryDue + r.bonus + r.ot - r.ded;
  r.remaining = r.earned - r.given;
  r.pct = r.earned>0 ? Math.min(100, Math.max(0, r.given/r.earned*100)) : (r.given>0?100:0);
  return r;
}

function openStaff(id){

/* ---------- Hareket girişi / düzenleme ---------- */
function openStaffEntry(staffId, kind, rec, src){
  const s = staffById(staffId); if(!s) return;
  const K = ST_KIND[kind] || ST_KIND.adv, editing = !!rec;
  const r = getRange(UI.st.p, UI.st.cf, UI.st.ct), k = staffStats(s, r.from, r.to);
  let paid = editing ? src==='pay' : !!K.paid, m = (rec&&rec.m) || 'cash';
  const canChoose = kind==='bonus' || kind==='ot';
  const hourMode = kind==='ot' && (!editing || isHourly(rec));
  const rateH = editing && isHourly(rec) ? (rec.rateH||0) : (s.otRate||0);
  if(hourMode && !editing && !(rateH>0)){

      ? '<div class="field"><label for="seH">Kaç saat?</label><input class="input st-amt-in" id="seH" inputmode="decimal" placeholder="0" value="'+(editing?esc(NFH.format(rec.hours)):'')+'" autocomplete="off"></div>'+
        '<div class="chips wrap" style="margin-top:8px">'+['0,5','1','2','3','4','8'].map(h=>'<button type="button" class="chip" data-seh="'+h+'">+'+h+' sa</button>').join('')+'<button type="button" class="chip" data-seh="0">Temizle</button></div>'+

    (canChoose && !editing ? '<div class="form-sec"><span class="label">Ödeme</span><div class="seg"><button type="button" class="'+(paid?'on':'')+'" data-sep="1">Şimdi ödendi</button><button type="button" class="'+(!paid?'on':'')+'" data-sep="0">Maaşa eklensin</button></div><p class="muted" style="font-size:calc(12.5px*var(--fs,1));margin:6px 0 0">'+(paid?'Para şimdi verildi: gider olarak işlenir.':'Para şimdi verilmedi: maaş ödenirken verilecek, kalan tutara eklenir.')+'</p></div>' : '')+
    (paid ? '<div class="form-sec"><span class="label">Ödeme yöntemi</span><div class="seg">'+['cash','bank','card'].map(x=>'<button type="button" class="'+(m===x?'on':'')+'" data-sem="'+x+'">'+ic(METHOD_ICON[x],17)+METHOD_SHORT[x]+'</button>').join('')+'</div></div>' : '')+

    if(b.dataset.sep){ paid = b.dataset.sep==='1'; redraw(); }

      if(a>=100000000){ toast('Tutar çok yüksek görünüyor','error'); return; }
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ toast('Tarih geçersiz','error'); return; }
      if(editing){
        const desc = s.name+' · '+K.t+(hx.hours?' '+hoursStr(hx.hours):'');
        if(src==='pay') dbUpdateTx(rec.id, Object.assign({a, d, m, note, desc}, hx));
        else { const before=Object.assign({},rec); Object.assign(rec,{a,d,note},hx); dbUpd('payroll', rec.id, Object.assign({a, d, note, editedBy:ME.name, editedTs:Date.now()}, hx), 'Düzenleme'); audit('düzenle','hakediş',rec.id,before,rec); }
      } else if(paid){
        dbAddTx(Object.assign({t:'out', a, c:perCatId(), m, d, desc:s.name+' · '+K.t+(hx.hours?' '+hoursStr(hx.hours):''), note, sup:null, sensitive:true, staffId, kind}, hx));
      } else {
        const p = dbAdd('payroll', Object.assign({staffId, kind, a, d, note, deleted:false}, hx), 'Hakediş');
        S.payroll = (S.payroll||[]).concat([p]); audit('ekle','hakediş',p.id,null,p);
      }
      sh.close(true); renderView(); openStaff(staffId);
      toast(K.t+' kaydedildi · '+(hx.hours?hoursStr(hx.hours)+' = ':'')+money(a)+(paid&&!editing?' · gider olarak işlendi':''),'success');
    }
  });
}

/* =========================================================
   GÜNLÜK DEFTER: hızlı gider girişi, günün kalemleri, kasa devri, WhatsApp raporu
   Kasa kuralı: Açılış kasası + nakit satışlar − kasadan ödenen giderler = Gün sonu kasası.
   Açılış kasası = son kapatılan günün gün sonu kasası (canlı hesaplanır; o gün sonradan
   düzenlenirse devreden kasa kendiliğinden yeniden hesaplanır). Elle değiştirilirse "days/{gün}"
   belgesine yazılır ve tüm telefonlarda eşitlenir.
   ========================================================= */
UI.ledgerDate = UI.ledgerDate || null;
function ledgerDay(){ return UI.ledgerDate || today(); }
function closingOn(d){ return S.closings.find(c=>c.d===d && !c.deleted) || null; }
function prevClosing(d){ let best=null; for(const c of S.closings){ if(!c.deleted && c.d<d && (!best || c.d>best.d)) best=c; } return best; }
function dayCarry(d, depth){ const o = dayOpening(d, (depth||0)+1), r = kasaRecorded(d); return o.v + r.cash - r.out; }
function dayOpening(d, depth){
  depth = depth||0;
  const ov = (S.days||{})[d];
  if(ov && ov.manual && typeof ov.open==='number') return {v:ov.open, src:'manual'};
  const p = prevClosing(d);
  if(!p){ const cl=closingOn(d); return {v: cl && typeof cl.open==='number' ? cl.open : 0, src:'none'}; }
  if(depth>90 || (loadedFrom && p.d<loadedFrom)) return {v: typeof p.carry==='number' ? p.carry : (p.expected||0), src:'auto', from:p.d};
  return {v: dayCarry(p.d, depth), src:'auto', from:p.d};
}
function ledgerExpenses(d){ return S.tx.filter(x=>x.t==='out' && x.d===d).sort((a,b)=>(a.ts||0)-(b.ts||0)); }
function ledgerState(d){
  const r = kasaRecorded(d), o = dayOpening(d), cl = closingOn(d);
  const online = r.online, carry = o.v + r.cash - r.out;
  const exps = ledgerExpenses(d), total = exps.reduce((a,x)=>a+x.a,0);
  return {r, o, cl, online, carry, exps, total};
}

  // giderler
  html += '<div class="card section"><div class="card-h"><h3>Giderler</h3><span class="muted">'+L.exps.length+' kalem</span></div>'+
    (L.exps.length ? '<div class="ledger-list">'+L.exps.map(x=>{ const c=catById(x.c);
      return '<button class="lrow" style="--by:'+personColor(x.byPid)+'" data-id="'+x.id+'"><span class="lt">'+esc(timeOf(x))+'</span><span class="lm"><b>'+esc(x.desc||c.name)+'</b><small>'+esc(c.name)+(x.m==='cash'?'':' · '+esc(METHOD_SHORT[x.m]||''))+'</small><small>'+byLine(x)+'</small></span><span class="la num">'+money(x.a)+'</span></button>'; }).join('')+'</div>'+
      '<div class="ledger-total"><span>Toplam gider</span><b class="num">'+money(L.total)+'</b></div>'+(L.total!==L.r.out?'<div class="muted" style="font-size:calc(12.5px*var(--fs,1));text-align:right;margin-top:2px">Kasadan ödenen: '+money(L.r.out)+'</div>':'')
      : '<div class="empty" style="padding:14px 8px"><p style="margin:0">Bu gün için gider yazılmamış. “Gider Ekle”ye bas, defterdeki gibi kalem kalem yaz.</p></div>')+'</div>';

/* ---------- Günü kapat (defterden) ---------- */
async function ledgerCloseDay(){
  const d = ledgerDay(), L = ledgerState(d);
  if(L.cl){ toast('Bu gün zaten kapatılmış','info'); return; }
  const raw = ($('#lCount')||{}).value||''; const counted = raw.trim() ? parseMoney(raw) : null;
  if(raw.trim() && (isNaN(counted)||counted<0)){ toast('Sayılan parayı sayı olarak yaz','error'); return; }
  const diff = counted==null ? 0 : counted-L.carry;
  const ok = await confirmDialog({title:'Gün kapatılsın mı?', icon:'lock', ok:'Günü Kapat',
    text:'Gün sonu kasası: <b>'+money(L.carry)+'</b><br>Bu tutar yarının açılış kasası olur.'+(counted==null?'':'<br>'+(diff===0?'Kasa tam.':diff<0?'Kasa eksik: <b>'+money(diff)+'</b>':'Kasa fazla: <b>'+money(diff,{sign:true})+'</b>'))});
  if(!ok) return;
  const rec = L.r;
  const sumKey = k=>S.tx.filter(x=>x.d===d && x.t==='in' && txComKey(x)===k);
  const lines = kasaLines(rec).map(l=>{ const xs=sumKey(l.k); const fee=xs.reduce((a,x)=>a+(x.fee||0),0); const rates=[...new Set(xs.filter(x=>x.rate!=null).map(x=>x.rate))];
    return {k:l.k, name:l.name, gross:l.rec, rate:rates.length===1?rates[0]:null, fee, net:l.rec-fee}; });
  const card = lines.filter(l=>l.k==='card').reduce((a,l)=>a+l.gross,0), online = lines.filter(l=>l.k!=='card').reduce((a,l)=>a+l.gross,0);
  const fee = lines.reduce((a,l)=>a+l.fee,0), gross = rec.cash+card+online;
  const cl = stampNew({d, open:L.o.v, cash:rec.cash, card, online, out:rec.out, expected:L.carry, carry:L.carry, counted:counted==null?L.carry:counted, noCount:counted==null, diff,
    note:'', txIds:[], lines, fee, gross, netIncome:gross-fee, exp:rec.exp, profit:gross-fee-rec.exp, via:'defter'});
  S.closings = S.closings.filter(c=>c.id!==d).concat([Object.assign({id:d},cl)]);
  dbSet(['closings',d], cl, false, 'Gün kapanışı').catch(()=>{});
  audit('gün kapattı','kapanış',d,null,cl);
  if(UI.lCount) delete UI.lCount[d];
  renderView(); window.scrollTo({top:0,behavior:'smooth'});
  toast('Gün kapatıldı · Yarına devreden kasa '+money(L.carry),'success',{duration:4000});
}

function waCfg(){ return Object.assign({phone:'', cash:true, cardOnline:true, count:true}, (S.config&&S.config.wa)||{}); }
function waMoney(k){ return (k%100===0 ? NF0.format(k/100) : NF.format(k/100))+' ₺'; }
function waPhone(p){ let s=String(p||'').replace(/\D/g,''); if(!s) return ''; if(s.indexOf('00')===0) s=s.slice(2); if(s.length===11 && s[0]==='0') s='90'+s.slice(1); else if(s.length===10 && s[0]==='5') s='90'+s; return s.length>=10 ? s : ''; }
function ledgerReport(d){
  const L = ledgerState(d), w = waCfg(), out = [];
  out.push('📅 '+trDate(d)+' Günlük Rapor');
  if(S.settings.biz) out.push('🏪 '+S.settings.biz);
  out.push('💰 Açılış kasası: '+waMoney(L.o.v));
  if(w.cash) out.push('🛒 Nakit satış: '+waMoney(L.r.cash));
  if(w.cardOnline){ out.push('💳 Kart satış: '+waMoney(L.r.card)); out.push('📱 Online satış: '+waMoney(L.online)); }
  out.push('');
  out.push('🧾 Giderler:');
  if(L.exps.length) L.exps.forEach(x=>out.push('• '+(x.desc||catById(x.c).name).replace(/\s+/g,' ')+' — '+waMoney(x.a)+(x.m==='cash'?'':' ('+(METHOD_SHORT[x.m]||'')+')')));
  else out.push('• Gider yok');
  out.push('Toplam gider: '+waMoney(L.total));
  out.push('');
  if(w.count && L.cl && !L.cl.noCount){ const df=L.cl.counted-L.carry; out.push('🔎 Sayılan kasa: '+waMoney(L.cl.counted)+(df?' ('+(df>0?'+':'−')+waMoney(Math.abs(df))+' fark)':'')); }
  else if(w.count && !L.cl){ const v=parseMoney(((UI.lCount||{})[d])||''); if(!isNaN(v)){ const df=v-L.carry; out.push('🔎 Sayılan kasa: '+waMoney(v)+(df?' ('+(df>0?'+':'−')+waMoney(Math.abs(df))+' fark)':'')); } }
  out.push('✅ Yarına devreden kasa: '+waMoney(L.carry)+(L.cl?'':' (gün kapatılmadı)'));
  return out.join('\n');
}

    let pin=null;
    if(!p){
      pin=$('#uPin',sh.el).value;
      if(!/^\d{6}$/.test(pin)){ err.textContent='PIN tam 6 rakam olmalı.'; return; }
      if(pin!==$('#uPin2',sh.el).value){ err.textContent='PIN’ler aynı değil.'; return; }
      if(/^(\d)\1{5}$/.test(pin)||pin==='123456'||pin==='654321'){ err.textContent='Bu PIN çok kolay. Başka bir PIN seç.'; return; }

    catch(e){ console.warn(e); busy(btn,false); err.textContent=authMsg(e); }
  };
}
async function savePerson(pid, T, pin){
  const isNew = !pid;
  pid = pid || randId(8);
  const prev = S.people.find(x=>x.id===pid) || {};
  let uidv = prev.uid, email = prev.email, ver = prev.ver||1;
  if(isNew){ email = pinEmail(pid,1); uidv = await createPinAccount(email, pin); ver = 1; }
  const perms = T.role==='admin' ? {} : T.perms;
  const pdoc = {name:T.name, color:T.color, role:T.role, active:T.active, email, uid:uidv, ver};
  const b = FB.writeBatch(fs);
  b.set(D('people',pid), Object.assign({}, pdoc, isNew?{createdAt:FB.serverTimestamp()}:{}), {merge:true});
  b.set(D('members',uidv), {pid, role:T.role, active:T.active, perms}, {merge:true});
  const list = S.people.filter(x=>x.id!==pid).concat([Object.assign({id:pid}, pdoc)]);
  b.set(D('public','roster'), {biz:S.settings.biz, people:list.map(rosterEntry)});
  await b.commit();
  S.people = list; S.members[uidv] = {pid, role:T.role, active:T.active, perms};
  lsSet(LS.roster, {biz:S.settings.biz, people:list.map(rosterEntry)});
  audit(isNew?'kullanıcı eklendi':'kullanıcı güncellendi','kullanıcı',pid,isNew?null:rosterEntry(Object.assign({id:pid},prev)),rosterEntry(Object.assign({id:pid},pdoc)));
}
function resetPin(pid){
  const p = S.people.find(x=>x.id===pid); if(!p) return;
  const sh = openSheet({title:p.name+' · PIN sıfırla', body:'<p class="muted" style="margin:0 0 14px">Yeni PIN belirle ve kişiye söyle. Eski PIN hemen geçersiz olur.</p><div class="two"><div class="field"><label for="rp1">Yeni PIN</label><input class="input" id="rp1" type="password" inputmode="numeric" maxlength="6" style="letter-spacing:.3em;text-align:center"></div><div class="field"><label for="rp2">Tekrar</label><input class="input" id="rp2" type="password" inputmode="numeric" maxlength="6" style="letter-spacing:.3em;text-align:center"></div></div><div class="amount-err" id="rpErr"></div>',
    foot:'<button class="btn btn-primary btn-lg" id="rpGo">PIN’i sıfırla</button>', focus:'#rp1'});
  $('#rpGo',sh.el).onclick = async ()=>{
    const a=$('#rp1',sh.el).value, err=$('#rpErr',sh.el), btn=$('#rpGo',sh.el);
    if(!/^\d{6}$/.test(a)){ err.textContent='PIN tam 6 rakam olmalı.'; return; }
    if(a!==$('#rp2',sh.el).value){ err.textContent='PIN’ler aynı değil.'; return; }
    busy(btn,true,'Sıfırlanıyor…');
    try{
      const ver=(p.ver||1)+1, email=pinEmail(pid,ver);
      const newUid = await createPinAccount(email, a);
      const old = S.members[p.uid]||{};
      const b = FB.writeBatch(fs);
      b.set(D('members',newUid), {pid, role:p.role, active:p.active!==false, perms:old.perms||{}});
      if(p.uid) b.set(D('members',p.uid), {active:false, replacedBy:newUid}, {merge:true});
      b.set(D('people',pid), {uid:newUid, email, ver}, {merge:true});
      const list = S.people.map(x=>x.id===pid?Object.assign({},x,{uid:newUid,email,ver}):x);
      b.set(D('public','roster'), {biz:S.settings.biz, people:list.map(rosterEntry)});
      await b.commit();
      S.people = list; lsSet(LS.roster,{biz:S.settings.biz, people:list.map(rosterEntry)});
      audit('pin sıfırlandı','kullanıcı',pid,null,null);
      sh.close(); toast(p.name+' için PIN sıfırlandı','success'); renderView();
    }catch(e){ busy(btn,false); err.textContent=authMsg(e); }
  };
}

async function reauthOwner(pw){
  const u = auth.currentUser; if(!u || !ME.owner) throw {code:'auth/requires-recent-login'};
  await FB.reauthenticateWithCredential(u, FB.EmailAuthProvider.credential(u.email, pw));
  return u;
}
function pwField(id,label,ac){ return '<div class="field" style="margin-top:12px"><label for="'+id+'">'+label+'</label><input class="input" id="'+id+'" type="password" autocomplete="'+(ac||'new-password')+'"></div>'; }
function openOwnerPassword(){
  const sh = openSheet({title:'Yönetici şifresini değiştir', body:'<p class="muted" style="margin:0">Güvenlik için önce şu anki şifreni yaz.</p>'+pwField('op0','Şu anki şifre','current-password')+pwField('op1','Yeni şifre (en az 8 karakter)')+pwField('op2','Yeni şifre tekrar')+'<div class="amount-err" id="opErr"></div>',
    foot:'<button class="btn btn-primary btn-lg" id="opGo">Şifreyi değiştir</button>', focus:'#op0'});
  $('#opGo',sh.el).onclick = async ()=>{
    const a=$('#op0',sh.el).value, b=$('#op1',sh.el).value, c=$('#op2',sh.el).value, err=$('#opErr',sh.el), btn=$('#opGo',sh.el);
    err.textContent='';
    if(!a){ err.textContent=authMsg({code:'auth/missing-password'}); return; }
    if(b.length<8){ err.textContent=authMsg({code:'local/short'}); return; }

    busy(btn,true,'Değiştiriliyor…');

  };

  };
  draw();

    const b = e.target.closest('[data-restore]'); if(!b) return;
    const x = items.find(i=>i.id===b.dataset.restore); if(!x) return;
    if(x._acc){ const pr=(S.payroll||[]).find(z=>z.id===x.id); if(pr) pr.deleted=false; dbUpd('payroll', x.id, {deleted:false}, 'Geri alma'); audit('geri al','hakediş',x.id,null,null); }
    else { if(!TXM.has(x.id)) TXM.set(x.id, Object.assign({}, x)); dbRestore([x.id]); }
    x.deleted=false; draw(); renderView();
    toast('Geri yüklendi · '+money(x.a)+' tekrar toplamlarda','success');
  });

const WIPE_COLS = [
  ['tx','Gelir / gider kayıtları'], ['ptx','Personel ödemeleri (maaş, avans, prim, mesai)'], ['payroll','Hakediş kayıtları (maaşa eklenen mesai/prim, kesinti)'],
  ['staff','Personel kartları'], ['closings','Gün sonu kapanışları'], ['suppliers','Cari kartları (tedarikçiler)'], ['payments','Cari ödemeleri'],
  ['photos','Fiş fotoğrafları'], ['days','Elle girilen açılış kasaları'], ['audit','İşlem geçmişi (denetim günlüğü)']
];
async function wipeSnapshot(){
  const out = {};
  const rs = await Promise.all(WIPE_COLS.map(c=>FB.getDocs(C(c[0]))));
  rs.forEach((r,i)=>{ out[WIPE_COLS[i][0]] = r.docs.map(d=>({id:d.id, ref:d.ref, data:d.data()})); });
  return out;
}

    '<div class="set-group"><h3>Kalacaklar</h3><div class="set-card" style="padding:12px 16px;font-size:calc(14.5px*var(--fs,1));line-height:1.7">'+ic('check',16,2.4).replace('<svg','<svg style="display:inline;vertical-align:-3px;color:var(--in)"')+' Yönetici hesabı ve giriş bilgileri<br>'+
      ic('check',16,2.4).replace('<svg','<svg style="display:inline;vertical-align:-3px;color:var(--in)"')+' Kategoriler, online platformlar ve komisyon oranları<br>'+

      ic('check',16,2.4).replace('<svg','<svg style="display:inline;vertical-align:-3px;color:var(--in)"')+' Yönetici rolündeki kullanıcılar ('+esc(S.people.filter(p=>p.role==='admin').map(p=>p.name).join(', ')||'—')+')</div></div>'+
    '<div class="set-group"><h3>İsteğe bağlı</h3><div class="set-card"><button type="button" class="perm" id="wpUsers" role="switch" aria-checked="'+delUsers+'"'+(others.length?'':' disabled')+'><div class="grow"><div style="font-weight:650">Test kullanıcılarını da sil</div><div class="muted" style="font-size:calc(12.5px*var(--fs,1))">'+(others.length?'Yönetici hariç '+others.length+' kullanıcı: '+esc(others.map(p=>p.name).join(', '))+'. Giriş yetkileri ve PIN’leri kaldırılır.':'Silinecek çalışan kullanıcı yok.')+'</div></div><span class="switch'+(delUsers?' on':'')+'"></span></button></div></div>'+

  $('#wpGo',sh.el).onclick = async ()=>{
    const n = total() + (delUsers?others.length:0);
    // 1) uyarı + SIL yazma
    const ok1 = await confirmDialog({title:'Geri alınamaz!', danger:true, icon:'alert', ok:'Devam',
      text:'<b>'+NF0.format(total())+' kayıt</b>'+(delUsers?' ve <b>'+others.length+' kullanıcı</b>':'')+' kalıcı olarak silinecek. Bu işlem geri alınamaz.<br>Onaylamak için kutuya <b>SIL</b> yaz.',
      extra:'<input class="input" id="wpConfirm" autocomplete="off" autocapitalize="characters" placeholder="SIL" style="margin:-8px 0 18px;text-align:center;font-weight:750;letter-spacing:.15em" aria-label="Onay metni">',
      validate:el=>{ const v=($('#wpConfirm',el).value||'').trim().toLocaleUpperCase('tr'); if(v!=='SIL' && v!=='SİL'){ shake($('#wpConfirm',el)); return false; } return true; }});
    if(!ok1) return;
    // 2) yönetici şifresi
    let pw = '';
    const ok2 = await confirmDialog({title:'Yönetici şifresi', icon:'lock', ok:'Doğrula ve sil', danger:true,
      text:'Son adım: Yönetici Paneli şifreni yaz.',
      extra:'<input class="input" id="wpPw" type="password" autocomplete="current-password" style="margin:-8px 0 18px" aria-label="Yönetici şifresi">',
      validate:el=>{ pw=$('#wpPw',el).value; if(!pw){ shake($('#wpPw',el)); return false; } return true; }});
    if(!ok2) return;
    const btn = $('#wpGo',sh.el); busy(btn,true,'Doğrulanıyor…');
    try{ await reauthOwner(pw); }
    catch(e){ busy(btn,false); toast(/wrong-password|invalid-credential|invalid-login/.test(e.code||'')?'Şifre yanlış. Hiçbir şey silinmedi.':authMsg(e)+' Hiçbir şey silinmedi.','error',{duration:6000}); return; }
    // 3) otomatik yedek
    btn.innerHTML='Yedek indiriliyor…';
    try{
      snap = await wipeSnapshot();
      const dump = {app:'donerkasa', kind:'teslim-oncesi-yedek', exported:new Date().toISOString(), shop:SHOP, data:{}, people:S.people, members:S.members, config:S.config};
      WIPE_COLS.forEach(c=>{ dump.data[c[0]] = snap[c[0]].map(x=>Object.assign({id:x.id}, x.data)); });
      if(!downloadFile('doner-kasa-teslim-oncesi-yedek-'+today()+'.json', JSON.stringify(dump), 'application/json')) throw new Error('yedek');
    }catch(e){ busy(btn,false); toast('Yedek indirilemedi, temizlik yapılmadı','error',{duration:6000}); return; }
    // 4) toplu silme
    btn.innerHTML='Siliniyor…';
    const refs = []; WIPE_COLS.forEach(c=>snap[c[0]].forEach(x=>refs.push(x.ref)));
    const removedUsers = delUsers ? others.slice() : [];
    removedUsers.forEach(p=>{ refs.push(D('people',p.id)); if(p.uid) refs.push(D('members',p.uid)); });
    Object.keys(S.members||{}).forEach(uid=>{ const m=S.members[uid]; if(delUsers && m && m.role!=='admin' && !refs.some(r=>r.path && r.path.endsWith('/members/'+uid))) refs.push(D('members',uid)); });
    const prog = $('#wpProg',sh.el); let done = 0;
    try{
      for(let i=0;i<refs.length;i+=400){
        const b = FB.writeBatch(fs); refs.slice(i,i+400).forEach(r=>b.delete(r)); await b.commit();
        done = Math.min(refs.length, i+400); prog.innerHTML='<div class="progress" style="margin-top:12px"><i style="width:'+(done/refs.length*100)+'%"></i></div><p class="muted" style="text-align:center">'+NF0.format(done)+' / '+NF0.format(refs.length)+'</p>';
      }
      const b2 = FB.writeBatch(fs);
      b2.set(D('state','main'), {recLast:{}}, {merge:true});
      if(delUsers){ const keep = S.people.filter(p=>p.role==='admin'); b2.set(D('public','roster'), {biz:S.settings.biz, people:keep.map(rosterEntry)}); }
      await b2.commit();
    }catch(e){
      busy(btn,false); console.warn(e);
      toast('Temizlik yarıda kaldı ('+NF0.format(done)+' kayıt silindi): '+(/permission/.test(e.code||'')?'güvenlik kuralları güncel değil. Yeni firestore.rules dosyasını yayınla ve tekrar dene.':(e.message||e.code)),'error',{duration:9000});
      return;
    }
    if(delUsers){
      const keep = S.people.filter(p=>p.role==='admin'); S.people = keep;
      lsSet(LS.roster, {biz:S.settings.biz, people:keep.map(rosterEntry)});
      const ph = lsGet(LS.pinh,{}); removedUsers.forEach(p=>delete ph[p.id]); lsSet(LS.pinh, ph);
    }
    TXM.clear(); rebuildTx(); S.suppliers=[]; S.payments=[]; S.closings=[]; S.staff=[]; S.payroll=[]; S.recLast={};
    if(UI.kasaDraft) UI.kasaDraft = {};
    sh.close(true);
    toast(NF0.format(total() + removedUsers.length)+' kayıt silindi'+(removedUsers.length?' · '+removedUsers.length+' kullanıcı kaldırıldı':''),'success',{duration:6000});
    setTimeout(()=>switchUser(), 900);
  };
}

async function boot(){

  if(h.indexOf('#katil=')===0){
    try{ const j=b64d(h.slice(7)); if(j.s){ if(j.c && j.c.projectId!==EMBED_CFG.projectId) lsSet(LS.cfg,j.c); else lsDel(LS.cfg); lsSet(LS.shop,j.s); lsDel(LS.roster); } }catch(e){ toast('Davet linki okunamadı','error'); }
    try{ history.replaceState(null,'',location.href.split('#')[0]); }catch(e){}
  }
  if(inPreview && !window.__FB_MOCK__){
    gateShow('<div class="gate-logo">'+ic('info',30)+'</div><h1>Önizleme penceresi</h1><p class="lead">Bu uygulama giriş ve senkron için internet adresinde çalışmalı. Kurulum rehberindeki adımlarla Netlify’a yükle ve oradaki linki aç.</p>');

  }
  if(lsGet(LS.cfgEdit,false)) return showSetupConfig();
  const cfg = activeCfg();
  gateShow('<div class="gate-logo">'+ic('repeat',28)+'</div><h1>Bağlanıyor…</h1><p class="lead">Veriler hazırlanıyor</p>');
  try{ await loadFB(); }
  catch(e){ return gateError('İnternet gerekli','Uygulama ilk açılışta internetten parçalarını indirmeli. İnternete bağlanıp tekrar dene.'); }
  try{ fbInit(cfg); }
  catch(e){ return gateError('Firebase ayarları hatalı', esc(e.message||''), true); }
  await authReady();
  SHOP = lsGet(LS.shop);
  if(!SHOP){
    const found = await findShopPointer();
    if(found){ SHOP = found; lsSet(LS.shop, SHOP); }
    else return showConnect(found===null);
  }
  await refreshRoster();
  if(auth.currentUser && !roster().some(p=>p.uid===auth.currentUser.uid)){ try{ await FB.signOut(auth); }catch(e){} }
  showRoster();
}

async function createShop(biz, name, color, pin){
  const ownerUid = auth.currentUser.uid;
  SHOP = randId(20);
  await FB.setDoc(FB.doc(fs,'shops',SHOP), {name:biz, owners:[ownerUid], createdAt:FB.serverTimestamp()});
  await FB.setDoc(FB.doc(fs,'owners',ownerUid), {shopId:SHOP});
  const pid = randId(8), email = pinEmail(pid,1);
  const pinUid = await createPinAccount(email, pin);
  const person = {id:pid, name, color, role:'admin', active:true, email, uid:pinUid};
  const b = FB.writeBatch(fs);
  b.set(D('people',pid), {name, color, role:'admin', active:true, email, uid:pinUid, ver:1, createdAt:FB.serverTimestamp()});
  b.set(D('members',pinUid), {pid, role:'admin', active:true, perms:{}});
  b.set(D('config','main'), {biz, cur:'sym', cats:DEF_CATS.map((c,i)=>Object.assign({order:i, budget:0}, c)), recurring:[], v:2});
  b.set(D('state','main'), {recLast:{}, lastBackup:null});
  b.set(D('public','roster'), {biz, people:[person]});
  await b.commit();
  await claimShopPointer();
  lsSet(LS.shop, SHOP); lsSet(LS.roster, {biz, people:[person]});
  await FB.signOut(auth);
  toast('Dükkan kuruldu','success');
  showRoster();
}

function showPinEntry(p, lockMode){
  if(!p) return;
  gateShow('<div class="pin-screen"><div class="pin-top"><div class="pin-av">'+avatar(p,80)+'</div><h1>'+esc(p.name)+'</h1><p class="lead" id="pinMsg" role="status">'+(lockMode?'Ekran kilitlendi. PIN’ini gir':'6 haneli PIN’ini gir')+'</p></div>'+
    '<div id="pinHost" class="pin-host"></div></div>');
  const msg = t=>{ $('#pinMsg').textContent=t; };
  let tries = 0;
  const pad = pinPad($('#pinHost'), async pin=>{
    msg('Kontrol ediliyor…');
    try{
      if(lockMode && auth.currentUser && auth.currentUser.uid===p.uid && await checkLocalPin(p.id,pin)){ pad.destroy(); unlock(); return; }
      await pinSignIn(p, pin);
      await loadMe();
      pad.destroy(); lockMode ? unlock() : enterApp();

      else msg(authMsg(e));
      pad.reset(true);
    }

async function sendOwnerReset(email, errEl, okEl, btn){
  errEl.textContent=''; okEl.hidden=true;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ errEl.textContent='Önce yukarıya yönetici e-postanı yaz, sonra tekrar bas.'; return; }
  busy(btn,true,'Gönderiliyor…');
  try{
    await FB.sendPasswordResetEmail(auth, email);
    okEl.hidden=false; okEl.innerHTML=ic('check',18,2.4)+'<span><b>E-posta gönderildi.</b> '+esc(email)+' adresinin gelen kutusunu (ve gereksiz/spam klasörünü) aç, gelen bağlantıdan yeni şifreni belirle. Sonra buradan yeni şifrenle gir.</span>';
    audit && ME.uid && audit('şifre sıfırlama istendi','yönetici','owner',null,null);
  }catch(e){ errEl.textContent = authMsg(e); }
  busy(btn,false);
}

    const p=b.dataset.period;
    if(p==='custom') openCustomRange(UI.home,(a,z)=>{ Object.assign(UI.home,{p:'custom',cf:a,ct:z,gran:null}); renderHome(); countUp($('#view')); });
    else { UI.home.p=p; UI.home.gran=null; renderHome(); countUp($('#view')); }
    return;
  }
  if((b=t.closest('[data-gran]'))){ UI.home.gran=b.dataset.gran; const r=getRange(UI.home.p,UI.home.cf,UI.home.ct); const tr=trendRange(UI.home,r); $$('[data-gran]').forEach(x=>x.classList.toggle('on',x.dataset.gran===tr.gran)); drawTrend($('#trend'),tr.from,tr.to,tr.gran); return; }
  if((b=t.closest('[data-ttype]'))){ UI.tx.t=b.dataset.ttype; UI.tx.limit=60; renderTx(); return; }
  if((b=t.closest('[data-addrec]'))){ addRecurring(b.dataset.addrec,false); return; }
  if((b=t.closest('[data-skiprec]'))){ addRecurring(b.dataset.skiprec,true); return; }
  if((b=t.closest('[data-sup]'))){ openSupplier(b.dataset.sup); return; }
  if((b=t.closest('[data-user]'))){ editUser(b.dataset.user); return; }
  if((b=t.closest('[data-staff]'))){ openStaff(b.dataset.staff); return; }
  if((b=t.closest('[data-stp]'))){ const p=b.dataset.stp; if(p==='custom') openCustomRange(UI.st,(a,z)=>{ Object.assign(UI.st,{p:'custom',cf:a,ct:z}); renderStaff(); }); else { UI.st.p=p; renderStaff(); } return; }
  if((b=t.closest('[data-kday]'))){ const d=addDays(UI.kasaDate||today(),+b.dataset.kday); if(d<=today()){ UI.kasaDate=d; renderKasa(); } return; }
  if((b=t.closest('[data-lday]'))){ const d=addDays(ledgerDay(),+b.dataset.lday); if(d<=today()){ UI.ledgerDate=d; renderLedger(); } return; }
  if((b=t.closest('[data-kgo]'))){ UI.kasaDate=b.dataset.kgo; renderKasa(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if((b=t.closest('[data-rtab]'))){ UI.rep.tab=b.dataset.rtab; renderReports(); return; }
  if((b=t.closest('[data-ryear]'))){ UI.rep.year+=+b.dataset.ryear; renderReports(); return; }
  if((b=t.closest('[data-rperiod]'))){ const p=b.dataset.rperiod; if(p==='custom'){ const r=getRange(UI.rep.p,UI.rep.cf,UI.rep.ct); UI.rep.cf=UI.rep.cf||r.from; UI.rep.ct=UI.rep.ct||r.to; } UI.rep.p=p; renderReports(); return; }
  if((b=t.closest('[data-rcmp]'))){ UI.rep.cmp=b.dataset.rcmp; renderReports(); return; }
  if((b=t.closest('[data-rwd]'))){ UI.rep.wd=b.dataset.rwd; renderReports(); return; }
  if((b=t.closest('[data-cur]'))){ setConfig({cur:b.dataset.cur},'Para birimi'); renderView(); return; }
  if((b=t.closest('[data-fs-set]'))){ S.settings.fs=b.dataset.fsSet; save(); applyFont(); drawBottomNav(); renderView(); redrawCharts(); toast('Yazı boyutu: '+b.textContent.replace(/^A/,'').trim(),'success'); return; }
  if((b=t.closest('[data-theme-set]'))){ S.settings.theme=b.dataset.themeSet; save(); applyTheme(); renderView(); return; }
});
document.addEventListener('change',e=>{
  const id = e.target.id, R = UI.rep;
  if(id==='rc1'||id==='rc2'){ R.cf=$('#rc1').value||R.cf; R.ct=$('#rc2').value||R.ct; renderReports(); }
  if(['ra1','ra2','rb1','rb2'].includes(id)){ R.a1=$('#ra1').value; R.a2=$('#ra2').value; R.b1=$('#rb1').value; R.b2=$('#rb2').value; renderReports(); }
});
document.addEventListener('keydown',e=>{
  if(dialogOpen) return;
  if(e.key==='Escape' && currentSheet){ e.preventDefault(); currentSheet.requestClose(); return; }
  if($('.lock')) return;
  const tg=e.target, typing = tg && (tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT'||tg.isContentEditable);
  if(typing || e.ctrlKey || e.metaKey || e.altKey || currentSheet) return;
  if(!ME.mode || !$('#gate').hidden) return;
  if((e.key==='n'||e.key==='N') && ME.mode==='app'){ e.preventDefault(); if(UI.view==='ledger') openQuickExpense(); else openForm(); }
  else if(e.key==='/'){ e.preventDefault(); go('tx'); setTimeout(()=>{ const s=$('#txSearch'); if(s) s.focus(); },30); }
});
let rzT; addEventListener('resize',()=>{ clearTimeout(rzT); rzT=setTimeout(redrawCharts,150); });
addEventListener('hashchange',()=>{ if(!ME.mode) return; if(Date.now()-NAV.lastIgnored<500 || NAV.t){ try{ const h2='#'+VIEWS[UI.view].hash; if(location.hash!==h2) history.replaceState(history.state,'',h2); }catch(e){} return; } const h=location.hash.slice(1); const v=Object.keys(VIEWS).find(k=>VIEWS[k].hash===h); if(v && v!==UI.view) go(v); });
function setupPWA(){
  try{
    const href = location.href.split('#')[0];
    const icon = $('link[rel="icon"]').href, mask = $('#iconMask').href;
    const man = {name:'Döner Kasa — Gelir Gider', short_name:'Döner Kasa', id:href, start_url:href, scope:href.replace(/[^/]*$/,''),
      display:'standalone', display_override:['standalone'], orientation:'portrait', background_color:'#15161a', theme_color:'#15161a', lang:'tr', dir:'ltr',
      icons:[{src:icon, sizes:'512x512', type:'image/png', purpose:'any'},{src:mask, sizes:'512x512', type:'image/png', purpose:'maskable'}]};
    const l = document.createElement('link'); l.rel='manifest'; l.href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(man));
    document.head.appendChild(l);
  }catch(e){}
  if('serviceWorker' in navigator && location.protocol==='https:'){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}

addEventListener('unhandledrejection',e=>{ e.preventDefault(); });
addEventListener('unhandledrejection',e=>{ e.preventDefault(); });
UI.kasaDate = today();
boot().then(setupPWA).catch(e=>{ console.error(e); gateError('Başlatılamadı', esc(e && e.message || String(e)), true); });

})();
</script>
